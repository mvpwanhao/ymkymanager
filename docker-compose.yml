# 局域网：http://<宿主机局域网IP>:8080
# 若在 .env 中设置了 YMKY_TRUSTED_HOSTS，须包含访问时用到的 Host（不含端口）。
#
# SakuraFrp：`profiles: natfrp`，见 docs/SAKURA_TUNNEL.md（与 cloudflared 二选一或可都不开）。
#
# Cloudflare Tunnel：`profiles: cloudflared`，在 .env 设置 CLOUDFLARE_TUNNEL_TOKEN（见 docs/CLOUDFLARE_TUNNEL.md）。
# Dashboard ingress 后端请填 http://ymky:8080（Compose 服务名 ymky），勿写 127.0.0.1。
#
# COMPOSE_PROFILES 可 comma 启用多个 profile，例如：cloudflared 或 natfrp

services:
  ymky:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: ymky-manager:latest
    container_name: ymky-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 按需覆盖（与 .env 二选一）；留空则不在此强制设置
      TZ: Asia/Shanghai
    volumes:
      # 台账 Excel、报表模板 sjcl.xlsx / nybb.xlsx、runtime 登录与密码等均落在此目录
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sakurafrp:
    container_name: sakurafrp
    image: natfrp.com/launcher
    pull_policy: always
    restart: unless-stopped
    profiles: ["natfrp"]
    network_mode: host
    depends_on:
      ymky:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # Sakura 面板「用户信息」中的访问密钥；未填写时拉起会失败（见文档）
      NATFRP_TOKEN: ${NATFRP_TOKEN:-}
    volumes:
      # 持久化 launcher 配置（证书、远程管理等）；勿提交仓库（见 .gitignore）
      - ./natfrp:/run

  cloudflared:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    pull_policy: if_not_present
    restart: unless-stopped
    profiles: ["cloudflared"]
    depends_on:
      ymky:
        condition: service_healthy
    # 勿挂载整份 .env：会把 CLOUDFLARE_TUNNEL_TOKEN 等打进容器，cloudflared 启动日志会明文打印变量名与值。
    # Compose 仍会从项目根 .env 做 ${CLOUDFLARE_TUNNEL_TOKEN} 插值，仅注入下面是运行所需。
    environment:
      TZ: Asia/Shanghai
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel run
