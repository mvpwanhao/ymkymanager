# 局域网：http://<宿主机局域网IP>:8080
# 若在 .env 中设置了 YMKY_TRUSTED_HOSTS，须包含访问时用到的 Host（不含端口）。
#
# SakuraFrp：`profiles: natfrp`，见 docs/SAKURA_TUNNEL.md（与 cloudflared 二选一或可都不开）。
#
# Cloudflare Tunnel 已移出本项目，独立部署于 /opt/cloudflared（docker-compose.yml）
# Dashboard ingress 后端请填 http://ymky:8080（Compose 服务名 ymky），勿写 127.0.0.1。
#
# COMPOSE_PROFILES 仅用于 natfrp（示例：COMPOSE_PROFILES=natfrp）

services:
  ymky:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: ymky-manager:latest
    container_name: ymky-manager
    restart: unless-stopped
    # 以宿主机 wanhao(uid=1000) 运行，避免 volume 写入文件属主为 root
    # 需配合 Dockerfile 中 appuser(uid=1000) 使用
    user: "1000:1000"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 按需覆盖（与 .env 二选一）；留空则不在此强制设置
      TZ: Asia/Shanghai
    volumes:
      # 台账 Excel、报表模板 sjcl.xlsx / nybb.xlsx、runtime 登录与密码等均落在此目录
      - ./data:/app/data
    # Kaleido 内置 Chromium 默认共享内存偏小易崩，导出 PNG 需足够 shm
    shm_size: "512mb"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases:
          - ymky
          - ymky-manager

  sakurafrp:
    container_name: sakurafrp
    image: natfrp.com/launcher
    pull_policy: always
    restart: unless-stopped
    profiles: ["natfrp"]
    network_mode: host
    depends_on:
      ymky:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # Sakura 面板「用户信息」中的访问密钥；未填写时拉起会失败（见文档）
      NATFRP_TOKEN: ${NATFRP_TOKEN:-}
    volumes:
      # 持久化 launcher 配置（证书、远程管理等）；勿提交仓库（见 .gitignore）
      - ./natfrp:/run

