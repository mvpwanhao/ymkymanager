# 局域网：http://<宿主机局域网IP>:8080
# 若在 .env 中设置了 YMKY_TRUSTED_HOSTS，须包含访问时用到的 Host（不含端口）。
#
# SakuraFrp 启动器（profile natfrp）：需在 .env 配置 NATFRP_TOKEN（见 docs/SAKURA_TUNNEL.md）。
# 生产可先写 COMPOSE_PROFILES=natfrp ，再 docker compose up -d（cron 脚本即可不带 --profile）。

services:
  ymky:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: ymky-manager:latest
    container_name: ymky-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # 按需覆盖（与 .env 二选一）；留空则不在此强制设置
      TZ: Asia/Shanghai
    volumes:
      # 台账 Excel、报表模板 sjcl.xlsx / nybb.xlsx、runtime 登录与密码等均落在此目录
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sakurafrp:
    container_name: sakurafrp
    image: natfrp.com/launcher
    pull_policy: always
    restart: unless-stopped
    profiles: ["natfrp"]
    network_mode: host
    depends_on:
      ymky:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # Sakura 面板「用户信息」中的访问密钥；未填写时拉起会失败（见文档）
      NATFRP_TOKEN: ${NATFRP_TOKEN:-}
    volumes:
      # 持久化 launcher 配置（证书、远程管理等）；勿提交仓库（见 .gitignore）
      - ./natfrp:/run
